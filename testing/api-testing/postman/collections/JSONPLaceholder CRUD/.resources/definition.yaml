$kind: collection
variables:
  baseUrl: ""
  postTitle: ""
  newPostId: ""
  postSchema: ""
scripts:
  - type: http:beforeRequest
    code: "const postSchema = {\r

      \    type: \"object\",\r

      \    required: [\"userId\", \"id\", \"title\", \"body\"],\r

      \    properties: {\r

      \        userId: { type: \"integer\", minimum: 1 },\r

      \        id:     { type: \"integer\", minimum: 1 },\r

      \        title:  { type: \"string\", minLength: 1 },\r

      \        body:   { type: \"string\", minLength: 1 }\r

      \    }\r

      }\r

      \r

      pm.collectionVariables.set(\"postSchema\", JSON.stringify(postSchema));"
    language: text/javascript
