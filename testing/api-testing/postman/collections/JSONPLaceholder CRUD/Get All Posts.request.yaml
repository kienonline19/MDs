$kind: http-request
url: "{{baseUrl}}/posts"
method: GET
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: "const postListSchema = {\r

      \ttype: \"array\",\r

      \tminItems: 1,\r

      \titems: {\r

      \t\ttype: \"object\",\r

      \t\trequired: [\"userId\", \"id\", \"title\", \"body\"],\r

      \t\tproperties: {\r

      \t\t\tuserId: { type: \"integer\" },\r

      \t\t\tid: { type: \"integer\" },\r

      \t\t\ttitle: { type: \"string\" },\r

      \t\t\tbody: { type: \"string\" }\r

      \t\t}\r

      \t}\r

      }\r

      \r

      pm.test(\"List matching the schema\", () => {\r

      \tpm.response.to.have.jsonSchema(postListSchema);\r

      });\r

      \r

      pm.test(\"Status code is 200\", function(){\r

      \    pm.response.to.have.status(200)\r

      });\r

      \r

      pm.test(\"Content-Type is application/json\", function(){\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"application/json\")\r

      });\r

      \r

      pm.test(\"Reponse time is less than 2000ms\", function(){\r

      \    pm.expect(pm.response.responseTime).to.be.below(2000);\r

      });\r

      \r

      const posts = pm.response.json();\r

      console.log(typeof posts);\r

      \r

      pm.test(\"The body section consists of 100 posts\", function(){\r

      \    pm.expect(posts).to.be.an(\"array\");\r

      \    pm.expect(posts).to.have.lengthOf(100);\r

      });\r

      \r

      pm.test(\"Each post contains all 4 fields userId, id, title, and body\", function(){\r

      \    posts.forEach(function(post){\r

      \        pm.expect(post).to.have.all.keys('userId', 'id', 'title', 'body')\r

      \    });\r

      });\r

      \r

      pm.test(\"The ID is unique\", function(){\r

      \    const ids = posts.map(post => post.id);\r

      \    pm.expect(new Set(ids).size).to.eql(ids.length);\r

      });\r\n"
    language: text/javascript
order: 9000
