$kind: http-request
url: "{{baseUrl}}/users/1"
method: GET
headers:
  Accept: application/json
  X-Request-Id: "{{$guid}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Response có header Content-Type\", () => {\r

      \tpm.response.to.have.header(\"Content-Type\");\r

      });\r

      \r

      pm.test(\"Content-Type chứa charset utf-8\", () => {\r

      \tpm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"utf-8\
      \");\r

      });\r

      \r

      const user = pm.response.json();\r

      \r

      pm.test(\"User có địa chỉ và công ty (object lồng nhau)\", () => {\r

      \tpm.expect(user).to.have.nested.property(\"address.city\");\r

      \tpm.expect(user).to.have.nested.property(\"address.geo.lat\");\r

      \tpm.expect(user).to.have.nested.property(\"company.name\");\r

      });\r

      \r

      console.log(\"Request id đã gửi:\",
      pm.request.headers.get(\"X-Request-Id\"));\r

      \r

      console.log(\"Tên user:\", user.name);"
    language: text/javascript
order: 13000
