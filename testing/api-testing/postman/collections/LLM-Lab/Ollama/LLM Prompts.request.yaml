$kind: http-request
url: "{{base_url}}/api/generate"
method: POST
body:
  type: json
  content: "{\r

    \t\"model\": \"{{model}}\",\r

    \t\"prompt\": \"Explain what an API is in two short sentences.\",\r

    \t\"stream\": false\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status is 200\", () => {\r

      \tpm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Content-Type is JSON\", () => {\r

      \tpm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"application/json\");\r

      });\r

      \r

      const data = pm.response.json();\r

      pm.test(\"Response contains a non-empty\", () => {\r

      \tpm.expect(data.response).to.be.a(\"string\");\r

      \r

      \tpm.expect(data.response.trim().length).to.be.above(0);\r

      });\r

      \r

      pm.test(\"Generation is complete\", () => {\r

      \tpm.expect(data.done).to.equal(true);\r

      });"
    language: text/javascript
order: 561281275082456
