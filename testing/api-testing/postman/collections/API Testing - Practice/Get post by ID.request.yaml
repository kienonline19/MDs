$kind: http-request
description: |-
  Retrieves a single post by its unique identifier.

  **Variables:**

  - `base_url` — The base URL of the API (e.g. `https://jsonplaceholder.typicode.com`).
      
  - `post_id` — The ID of the post to retrieve.
      

  **Response (200 OK):**  
  Returns a JSON object representing the post:

  ``` json
  {
    "userId": 1,
    "id": 2,
    "title": "string",
    "body": "string"
  }

   ```

  - `userId` — ID of the user who created the post.
      
  - `id` — Unique identifier of the post.
      
  - `title` — Title of the post.
      
  - `body` — Full content/body of the post.
url: "{{base_url}}/posts/{{post_id}}"
method: GET
order: 1789547891211
